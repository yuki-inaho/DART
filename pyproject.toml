[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dart-detect"
dynamic = ["version"]
description = "DART: Detect Anything in Real Time — training-free framework that converts SAM3 into a real-time multi-class open-vocabulary detector"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Mehmet Kerem Turkcan"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "numpy>=1.26,<2",
    "scipy",
    "opencv-python",
    "pillow",
    "onnx>=1.20.1",
    "onnxscript",
    "onnxslim",
    "tqdm",
    "ftfy==6.1.1",
    "regex",
    "iopath>=0.1.10",
    "typing_extensions",
    "huggingface_hub",
    "timm>=1.0.17",
    "safetensors",
    "transformers",
    "einops",
    "pycocotools",
    "decord",
    "psutil",
    "triton-windows; sys_platform == 'win32'",
]

[project.optional-dependencies]
tensorrt = [
    "tensorrt>=10.9.0",
    "onnx_graphsurgeon",
    "polygraphy",
]
eval = [
    "scikit-image",
    "scikit-learn",
]
notebooks = [
    "matplotlib",
    "jupyter",
    "notebook",
    "ipywidgets",
    "ipycanvas",
    "ipympl",
    "scikit-image",
    "scikit-learn",
]
train = [
    "hydra-core",
    "submitit",
    "tensorboard",
    "torchmetrics",
    "fvcore",
    "fairscale",
    "scikit-image",
    "scikit-learn",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff>=0.15",
    "ty>=0.0.38",
    "radon>=6.0",
    "jaxtyping>=0.3",
    "beartype>=0.22",
]

[project.urls]
"Homepage" = "https://huggingface.co/mehmetkeremturkcan/DART"

[tool.setuptools.packages.find]
include = ["sam3*"]
exclude = ["build*", "scripts*"]

[tool.setuptools.package-data]
sam3 = ["assets/*.txt.gz"]

[tool.setuptools.dynamic]
version = {attr = "sam3.__version__"}

# ---------- ruff (replaces black + isort + flake8) ----------
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["sam3", "scripts"]
extend-exclude = [
    "sam3/backbones/efficientvit",
    "sam3/agent",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line length (formatter handles)
    "E402",   # import not at top (conditional imports common in ML)
    "E721",   # type comparison (intentional in some torch dispatch)
    "E722",   # bare except (legacy patterns)
    "E731",   # lambda assignment
    "E741",   # ambiguous variable name (l, I, O common in ML)
    "B905",   # zip-strict (noisy in existing code)
    "SIM102", # collapsible if (readability preference)
    "SIM105", # suppressible exception
    "SIM108", # ternary operator (readability preference)
    "SIM117", # multiple with statements
    "UP015",  # unnecessary open mode
    "RUF001", # ambiguous unicode in string
    "RUF002", # ambiguous unicode in docstring
    "RUF003", # ambiguous unicode in comment
    "RUF012", # mutable class default (common in nn.Module)
    "RUF013", # implicit optional (too many in vendored code)
]

[tool.ruff.lint.per-file-ignores]
"sam3/train/**" = ["E", "W", "UP", "SIM", "C4"]
"scripts/**" = ["F821", "B023", "B008", "SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["sam3"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- ty (type checker, replaces mypy) ----------
[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Suppress noisy rules from incomplete torch/numpy type stubs
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"      # optional deps (tensorrt, triton, etc.)
not-subscriptable = "ignore"
call-non-callable = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"
not-iterable = "ignore"
possibly-missing-submodule = "ignore"
invalid-assignment = "ignore"     # torch tensor assignments
invalid-parameter-default = "ignore"  # implicit Optional defaults
invalid-method-override = "ignore"    # nn.Module subclass signatures

[tool.ty.src]
exclude = [
    "sam3/backbones/efficientvit",
    "sam3/agent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
